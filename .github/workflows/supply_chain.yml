name: Supply Chain Checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: supply-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan added lines for hidden bidi/zero-width control characters
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          hits=0
          while IFS= read -r line; do
            if python3 -c "
import sys
s = sys.argv[1]
bad = [ch for ch in s if 0x202A <= ord(ch) <= 0x202E or ord(ch) in (0x200B, 0x2060, 0xFEFF)]
sys.exit(0 if bad else 1)
" "$line"; then
              echo "HIDDEN CONTROL CHARACTER: $line"
              hits=$((hits+1))
            fi
          done < <(git diff "$base" --unified=0 | grep '^+' | grep -v '^+++')
          if [ "$hits" -gt 0 ]; then
            echo "FAIL: $hits hidden control character(s) found in added lines (trojan-source / prompt-injection vector)"
            exit 1
          fi
          echo "PASS: no hidden bidi/zero-width control characters in added lines"

  dependency-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: spdx-json
          artifact-name: zar-plus-sbom.spdx.json
