name: Phase A2 Flutter CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: phase-a2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pocketbase-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      POCKETBASE_VERSION: 0.40.4
      POCKETBASE_LINUX_AMD64_SHA256: 9042ec818570e79c3628dadcd0a756c1496d9e1173918ec409d133c02f82e5fa
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download verified PocketBase
        run: |
          curl --fail --silent --show-error --location \
            --output pocketbase.zip \
            "https://github.com/pocketbase/pocketbase/releases/download/v${POCKETBASE_VERSION}/pocketbase_${POCKETBASE_VERSION}_linux_amd64.zip"
          echo "${POCKETBASE_LINUX_AMD64_SHA256}  pocketbase.zip" | sha256sum --check --strict
          unzip -q pocketbase.zip pocketbase
          chmod +x pocketbase
          ./pocketbase --version

      - name: Test PocketBase authorization and migration lineages
        env:
          ZAR_POCKETBASE: ${{ github.workspace }}/pocketbase
        run: |
          bash -n \
            server/scripts/guarded_transactional_restore_deploy.sh \
            server/scripts/guarded_transactional_restore_rollback.sh \
            server/scripts/guarded_transactional_restore_contain.sh \
            server/scripts/test_guarded_transactional_restore_clone.sh
          python3 -m unittest -v \
            server.tests.transactional_restore_state_test \
            server.tests.transactional_restore_state_guard_test \
            server.tests.transactional_restore_expected_state_test \
            server.tests.transactional_restore_canary_test
          python3 server/tests/pocketbase_authz_test.py --pocketbase "$PWD/pocketbase"
          python3 server/tests/pocketbase_migration_lineage_test.py --pocketbase "$PWD/pocketbase"
          python3 server/tests/pocketbase_transactional_restore_test.py --pocketbase "$PWD/pocketbase"

  flutter-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build default ZAR+ web preview
        run: flutter build web --debug

      - name: Upload ZAR+ web preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zar-plus-phase-a2-web
          path: build/web
          if-no-files-found: error
          retention-days: 7
